  RULEBOX([['Power: P = V × I','Use I in amps.'],['Battery life (h) = mAh ÷ mA','How long the battery will last.']])+
  PCK(25,'c','Today’s checklist',['At least one switch or pushbutton','At least one buzzer or motor','Every switch position tested','Switch table written'])+PNT(25,'c','My switch table: switch positions and what turns on',4),
  qs:[R=>{const V=pickOf(R,[3,5,6,9,12]),I=R(10,90);return [`A part uses ${V} V and ${I} mA. What power does it use?`,r3(V*I/1000),'W','P = V × I, with I in amps.',`${I} mA = ${I/1000} A. ${V} × ${I/1000} = ${r3(V*I/1000)} W.`];},
   R=>{const V=pickOf(R,[5,6,9,12]),P=pickOf(R,[0.18,0.3,0.36,0.6,0.9]);return [`A motor uses ${P} W on a ${V} V supply. What current does it draw, in amps?`,r3(P/V),'A','I = P ÷ V',`${P} ÷ ${V} = ${r3(P/V)} A.`];},
   R=>{const C=pickOf(R,[300,400,500,600,1000,1200]),I=pickOf(R,[20,25,40,50,60,100]);return [`A ${C} mAh battery powers a circuit that draws ${I} mA. About how many hours will it last?`,r2(C/I),'h','Battery life = capacity ÷ current',`${C} ÷ ${I} = ${r2(C/I)} hours.`];},
   mc('A switch sits in one parallel branch. What happens when you open it?',['Only that branch turns off','The whole circuit turns off','Every LED gets brighter','The battery reverses'],0,'Each branch has its own path.','Opening the switch breaks only that branch’s path. The other branches keep working.'),
   mc('Two switches are in series with a buzzer. When does the buzzer sound?',['Only when both switches are closed','When either switch is closed','Only when both are open','Always'],0,'Current has to pass through both switches.','In series, current flows only if both switches are closed. This is AND.'),
   mc('Two switches are in parallel, and together they control a buzzer. When does the buzzer sound?',['When either switch is closed','Only when both switches are closed','Only when both are open','Never'],0,'Either path can carry the current.','In parallel, either closed switch gives the current a path. This is OR.')]},
 {t:'Measure',h:'Measure and troubleshoot',qt:'Measurement check',
  html:GOAL('Today you prove your math. Measure in 3 places and compare each reading with your Ohm’s-law prediction.')+
  TC('Use the multimeter',['Drag in a Multimeter.','Current: set it to A (amps) and put it in series. Break the path and connect the meter into the gap.','Voltage: set it to V (volts) and put it in parallel. Touch the two leads to each side of the part.','Run the simulation and record each reading.'])+
  RULEBOX([['Percent difference = |measured − predicted| ÷ predicted × 100','Within 10% passes.'],['Predicted current: I = V ÷ R','Predicted voltage: V = I × R']])+
  GRID('Troubleshooting',[['Nothing works','Check the battery wires and the main switch. Is the path broken?'],['One LED is dark','It may be in backward. Flip it so the bent leg faces +.'],['LED warning','Too much current. Recheck the resistor value.'],['Motor will not spin','Check its wires and that its switch is closed.']])+
  PCK(25,'m','Today’s checklist',['Reading 1 recorded and compared','Reading 2 recorded and compared','Reading 3 recorded and compared','All three within 10%, or fixed until they are'])+PNT(25,'m','My 3 readings: predicted, measured, and percent difference',4),
  qs:[R=>{const p=pickOf(R,[10,15,20,25,30]),m=p+pickOf(R,[-3,-2,-1,1,2,3]);return [`You predicted ${p} mA and measured ${m} mA. What is the percent difference?`,r2(Math.abs(m-p)/p*100),'%','|measured − predicted| ÷ predicted × 100',`|${m} − ${p}| = ${Math.abs(m-p)}. ${Math.abs(m-p)} ÷ ${p} × 100 = ${r2(Math.abs(m-p)/p*100)}%.`];},
   R=>{const V=pickOf(R,[5,6,9,12]),Rr=pickOf(R,[200,250,300,400,500,600]);return [`Predict the current through a ${Rr} Ω resistor with ${V} V across it, in mA.`,r2(V/Rr*1000),'mA','I = V ÷ R, then × 1000.',`${V} ÷ ${Rr} × 1000 = ${r2(V/Rr*1000)} mA.`];},
   R=>{const I=pickOf(R,[10,15,20,25]),Rr=pickOf(R,[100,150,220,330,470]);return [`A ${Rr} Ω resistor carries ${I} mA. What voltage should the meter show across it?`,r2(I/1000*Rr),'V','V = I × R, with I in amps.',`${I/1000} × ${Rr} = ${r2(I/1000*Rr)} V.`];},
   mc('To measure current with the multimeter, you connect it…',['In series, in the path of the current','In parallel, across the part','Only across the battery','You do not connect it'],0,'Current has to flow through the meter.','The current must pass through the meter, so it goes in series.'),
   mc('One LED stays dark, but the rest of the circuit works. What should you check first?',['Whether that LED is in backward','Whether the battery is too new','Whether the wires are red','Whether the buzzer is too loud'],0,'LEDs only work one way.','An LED in backward blocks the current. Flip it so the bent leg faces +.'),
   mc('Your reading is 14% off from your prediction. What should you do?',['Recheck the resistor value and the meter setup, then measure again','Change your prediction to match','Skip that reading','Add more batteries'],0,'The rule is within 10%.','Find the cause first: a wrong resistor value or meter setting is the usual reason.')]},
 {t:'Present',h:'Present your circuit',qt:'Project wrap-up',

const PROJ26=PU(26,'Project week: bottle rocket',{
 vocab:[['Center of gravity','The balance point of the rocket (CG).'],['Center of pressure','The point where the air pushes on the rocket on average (CP).'],['Nose cone','The pointed top that cuts through the air.'],['Ballast','Extra mass, like clay, added to the nose to move the CG forward.'],['Stability margin','The distance from the CG back to the CP.'],['Flight time','Seconds from liftoff until the rocket lands.']],

 rvFixed:{2:[{p:'A 2-liter (2000 mL) bottle is filled 30% with water. How many mL is that?',a:600,u:'mL',h:'2000 × 0.30',s:'2000 × 0.30 = 600 mL.'}],

  4:[{p:'The CG is 25 cm from the nose and the CP is 37 cm from the nose. What is the stability margin?',a:12,u:'cm',h:'CP − CG',s:'37 − 25 = 12 cm.'},{p:'The margin is 12 cm and the bottle is 10 cm wide. How many body widths is that?',a:1.2,u:'',h:'Margin ÷ width',s:'12 ÷ 10 = 1.2 body widths.'},{p:'A 200 g rocket body has its CG 30 cm from the nose. You add 50 g of clay at 5 cm from the nose. Where is the new CG?',a:25,u:'cm',h:'(m₁ × x₁ + m₂ × x₂) ÷ (m₁ + m₂)',s:'(200 × 30 + 50 × 5) ÷ 250 = 6250 ÷ 250 = 25 cm.'}],
  5:[{p:'A rocket’s total flight time is 4 s. About how high did it go?',a:19.6,u:'m',h:'h ≈ 1.225 × T²',s:'1.225 × 16 = 19.6 m.'}]},
 days:[
 {t:'Design',h:'Design your rocket with math',qt:'Rocket design math',
  html:GOAL('Today you design your bottle rocket on paper, using what you learned from the straw rocket fin tests.')+ROCKET()+
  GRID('Parts of a bottle rocket',[['Body','A 2-liter soda bottle, nozzle down. It holds the water and air.'],['Fins','At least 3, near the nozzle. They keep the rocket pointed straight.'],['Nose cone','On top. It cuts through the air and holds the ballast.'],['Ballast','A little clay in the nose moves the CG forward and makes the rocket stable.']])+
  PB('The stability rule','The center of gravity (CG, the balance point) must be closer to the nose than the center of pressure (CP). Fins at the back move the CP back. Clay in the nose moves the CG forward. If the CG is behind the CP, the rocket tumbles.')+
  RULEBOX([['Water mass: 1 mL = 1 g',''],['Launch mass = dry mass + water',''],['Acceleration = (thrust − weight) ÷ mass','Weight = mass × 9.8']])+
  WX('Worked example','A rocket has a dry mass of 200 g and holds 600 mL of water. The thrust is 80 N. What is its acceleration at liftoff?',['Mass = 200 + 600 = 800 g = 0.8 kg','Weight = 0.8 × 9.8 = 7.84 N','Acceleration = (80 − 7.84) ÷ 0.8 ≈ 90.2 m/s²'])+
  PCK(26,'d','Today’s checklist',['Sketched my rocket with dimensions','Drew a fin template','Picked my number of fins','Planned where the ballast goes','Picked 2 water fill levels to test'])+PNT(26,'d','My design: fin shape and size, number of fins, nose cone plan, and fill levels',4),
  qs:[R=>{const p=pickOf(R,[20,25,30,35,40]);return [`A 2-liter (2000 mL) bottle is filled ${p}% with water. How many mL of water is that?`,20*p,'mL','2000 × percent ÷ 100',`2000 × ${p} ÷ 100 = ${20*p} mL.`];},
   R=>{const d=R(15,28)*10,w=R(4,8)*100;return [`Your rocket has a dry mass of ${d} g and holds ${w} mL of water. What is its launch mass in kg?`,r3((d+w)/1000),'kg','1 mL of water = 1 g. Add, then divide by 1000.',`${d} + ${w} = ${d+w} g = ${r3((d+w)/1000)} kg.`];},
   R=>{const m=R(4,10)/10;return [`A rocket’s launch mass is ${m} kg. What is its weight in newtons?`,r2(m*9.8),'N','Weight = mass × 9.8',`${m} × 9.8 = ${r2(m*9.8)} N.`];},
   R=>{const m=R(4,9)/10,T=R(4,12)*10;return [`A rocket with a launch mass of ${m} kg has ${T} N of thrust. What is its acceleration at liftoff?`,r2((T-m*9.8)/m),'m/s²','Weight = m × 9.8. Acceleration = (thrust − weight) ÷ mass.',`Weight = ${r2(m*9.8)} N. (${T} − ${r2(m*9.8)}) ÷ ${m} = ${r2((T-m*9.8)/m)} m/s².`];},
   R=>{const a=R(4,8),b=R(8,12),h=R(5,9);return [`A trapezoid fin has parallel sides of ${a} cm and ${b} cm and a height of ${h} cm. What is its area?`,r2((a+b)/2*h),'cm²','Area = (a + b) ÷ 2 × h',`(${a} + ${b}) ÷ 2 × ${h} = ${r2((a+b)/2*h)} cm².`];},
   mc('Where should the center of gravity be for a stable rocket?',['Closer to the nose than the center of pressure','Behind the center of pressure','Exactly at the fins','It does not matter'],0,'The heavy end should lead.','A CG ahead of the CP keeps the nose pointed into the wind, so the rocket flies straight.')]},
 {t:'Build',h:'Build day',qt:'Build check',
  html:GOAL('Today you build your rocket. Measure twice, cut once, and keep every fin the same.')+FINS()+
  STEPS('How to build it',['Trace your fin template onto cardboard, foam board, or corrugated plastic. Cut out all the fins the same.','Measure the bottle’s circumference with a strip of paper. Divide by the number of fins and mark the spacing.','Attach the fins straight along the marks near the nozzle with hot glue or duct tape. Keep the bottom '+CFG.rocketClear+' cm clear for the launcher.','Make a nose cone from paper or a cut-off bottle top (never the pressure bottle). Put clay ballast inside, then tape it on.','Write your name on the rocket and weigh it. Record the dry mass.'])+
  PB('Safety','Hot glue burns. Use the low-temperature setting and keep fingers away from the tip. Never cut, heat, or poke the bottle that will hold pressure.')+
  PCK(26,'b','Today’s checklist',['All fins cut the same','Fin spacing measured and marked','Fins attached straight with the bottom '+CFG.rocketClear+' cm clear','Nose cone with ballast attached','Name on the rocket and dry mass recorded'])+PNT(26,'b','My rocket’s dry mass, and anything I changed from my design'),
  qs:[R=>{const n=R(3,6);return [`Your rocket has ${n} fins. How many degrees apart should they be?`,r2(360/n),'°','360 ÷ number of fins',`360 ÷ ${n} = ${r2(360/n)}°.`];},
   R=>{const d=pickOf(R,[9,9.5,10,10.5,11]);return [`A bottle is ${d} cm wide. What is its circumference? (use π ≈ 3.14)`,r2(3.14*d),'cm','C = π × d',`3.14 × ${d} = ${r2(3.14*d)} cm.`];},
   R=>{const C=pickOf(R,[30,31.4,32,33]),n=R(3,5);return [`The bottle’s circumference is ${C} cm. You have ${n} fins. How far apart should you mark them along the bottle?`,r2(C/n),'cm','Circumference ÷ number of fins',`${C} ÷ ${n} = ${r2(C/n)} cm.`];},
   R=>{const M=CFG.rocketMass,d=R(Math.round(M*0.06),Math.round(M*0.09))*10,c=R(2,6)*10;return [`Your rocket’s dry mass is ${d} g. You add ${c} g of clay ballast. What percent of the ${M} g limit is the new mass?`,r2((d+c)/M*100),'%',`Add, then divide by ${M} and × 100.`,`${d} + ${c} = ${d+c} g. ${d+c} ÷ ${M} × 100 = ${r2((d+c)/M*100)}%.`];},
   mc('Why must the fins be identical and evenly spaced?',['So the air pushes evenly and the rocket flies straight','To make the rocket heavier','So the water stays inside','To lower the pressure'],0,'Uneven fins push unevenly.','Even fins get even pushes from the air, so the rocket does not curve or spin off course.'),
   mc('Which bottle is safe to pressurize?',['A 2-liter soda bottle','A thin water bottle','A milk jug','A glass bottle'],0,'Which bottle was made to hold fizz?','Soda bottles are made to hold pressure. The others can burst.')]},
 {t:'Pre-flight',h:'Stability test and pre-flight check',qt:'Pre-flight check',
  html:GOAL('A rocket that is not stable tumbles and goes nowhere. Today you find the CG and prove your rocket is stable before launch day.')+ROCKET()+
  STEPS('Find the CG and run a swing test',['Balance the empty rocket sideways on one finger. The balance point is the CG. Mark it with tape.','Tie a string tightly around the rocket at the CG.','Outside, in a clear space, swing the rocket in a circle around you.','If it flies nose-first, it is stable. If it wobbles or tumbles, add clay to the nose or make the fins bigger, then test again.'])+
  WX('Moving the CG with ballast','A 200 g rocket has its CG 30 cm from the nose. You add 50 g of clay 5 cm from the nose. Where is the new CG?',['New CG = (m₁ × x₁ + m₂ × x₂) ÷ (m₁ + m₂)','(200 × 30 + 50 × 5) ÷ 250 = 6250 ÷ 250','= 25 cm from the nose. The CG moved 5 cm forward.'])+
  PB('Watch the water','At launch, the water sits at the nozzle end. That moves the CG back toward the fins. Leave room for that: aim for a margin of at least one body width.')+
  PCK(26,'s','Pre-flight checklist',['CG marked','Swing test passed (nose-first)','Fins and nose cone are firm','Nozzle is clear','Data table ready, with 2 timers chosen'])+PNT(26,'s','Swing test result and any changes I made'),
  qs:[R=>{const g=R(20,30),p=g+R(8,16);return [`The CG is ${g} cm from the nose and the CP is ${p} cm from the nose. What is the stability margin?`,p-g,'cm','Margin = CP − CG',`${p} − ${g} = ${p-g} cm.`];},
   R=>{const m=R(8,16),w=pickOf(R,[10,10.5,11]);return [`The stability margin is ${m} cm and the bottle is ${w} cm wide. How many body widths is that?`,r2(m/w),'','Margin ÷ width',`${m} ÷ ${w} = ${r2(m/w)} body widths.`];},
   R=>{const m1=R(15,25)*10,x1=R(26,34),m2=R(2,6)*10,x2=R(3,8);const cg=(m1*x1+m2*x2)/(m1+m2);return [`A ${m1} g rocket has its CG ${x1} cm from the nose. You add ${m2} g of clay ${x2} cm from the nose. Where is the new CG, in cm from the nose?`,r2(cg),'cm','(m₁ × x₁ + m₂ × x₂) ÷ (m₁ + m₂)',`(${m1} × ${x1} + ${m2} × ${x2}) ÷ ${m1+m2} = ${m1*x1+m2*x2} ÷ ${m1+m2} = ${r2(cg)} cm.`];},
   mc('Your rocket tumbles in the swing test. What is the best fix?',['Add clay to the nose','Add clay near the fins','Make the fins smaller','Add more water'],0,'Move the CG forward.','Clay in the nose moves the CG forward, ahead of the CP.'),
   mc('At launch, where does the water move the center of gravity?',['Back toward the nozzle, because the water sits there','Forward toward the nose','Nowhere','Out of the rocket'],0,'The rocket stands nozzle-down.','The water collects at the nozzle end, so the CG moves back toward the fins.'),
   R=>{const M=CFG.rocketMass,d=R(Math.round(M*0.065),Math.floor((M-10)/10))*10;return [`Your rocket’s dry mass is ${d} g and the limit is ${M} g. How many grams under the limit are you?`,M-d,'g','Limit − mass',`${M} − ${d} = ${M-d} g.`];}]},
 {t:'Launch',h:'Launch day',qt:'Launch math',
  html:GOAL('Today you launch. Time every flight carefully, because your height estimate depends on it.')+
  STEPS('Launch procedure',['Goggles on. Everyone stays behind the line unless the teacher says otherwise.','Jobs: 2 timers, 1 recorder, 1 spotter. Only the teacher pumps and launches.','Fill your rocket to your planned level with a measuring cup.','Countdown. Both timers start at liftoff and stop when the rocket lands.','Wait until the rocket lands and the teacher says it is safe before you pick it up.','Launch at least 3 times, and use 2 fill levels if you can. Record every time.'])+
  RULEBOX([['Height ≈ 1.225 × T²','T = total flight time in seconds.'],['Use the mean of the 2 timers','It cancels out small timing mistakes.']])+
  PB('Where 1.225 × T² comes from','Without air drag, a rocket takes as long to come down as to go up, so the fall takes T ÷ 2 seconds. A falling object drops 4.9 × t² meters in t seconds. 4.9 × (T ÷ 2)² = 1.225 × T². Air drag makes the real height a little lower.')+
  PCK(26,'l','Launch-day checklist',['Goggles on','Jobs assigned','Launch 1 timed and recorded','Launch 2 timed and recorded','Launch 3 timed and recorded'])+PNT(26,'l','Launch data: fill level, timer 1, timer 2, mean time, and height for each launch',5),
  qs:[R=>{const T=R(25,70)/10;return [`A rocket’s total flight time is ${T} s. About how high did it go? (h ≈ 1.225 × T²)`,r2(1.225*T*T),'m','Square the time, then multiply by 1.225.',`${T}² = ${r2(T*T)}, and 1.225 × ${r2(T*T)} = ${r2(1.225*T*T)} m.`];},
   R=>{const a=R(30,60)/10,b=r2(a+pickOf(R,[-0.4,-0.2,0.2,0.4]));return [`Timer 1 reads ${a} s and timer 2 reads ${b} s. What is the mean flight time?`,r2((a+b)/2),'s','Add, then divide by 2.',`(${a} + ${b}) ÷ 2 = ${r2((a+b)/2)} s.`];},
   R=>{const h=[R(10,30),R(10,30),R(10,30)];return [`Three launches reached ${h[0]} m, ${h[1]} m and ${h[2]} m. What is the mean height?`,r2((h[0]+h[1]+h[2])/3),'m','Add them, then divide by 3.',`${h[0]+h[1]+h[2]} ÷ 3 = ${r2((h[0]+h[1]+h[2])/3)} m.`];},
   R=>{const T=R(3,6)*1,h=r2(1.225*T*T);return [`A rocket flew for ${T} s and reached about ${h} m. What was its average speed on the way up? (It went up for half the flight.)`,r2(h/(T/2)),'m/s','Speed = distance ÷ time. Time up = T ÷ 2.',`${h} ÷ ${T/2} = ${r2(h/(T/2))} m/s.`];},
   mc('Why do you use two timers?',['The mean of two times reduces timing mistakes','So the rocket flies longer','Because the launcher needs two people','To measure the water'],0,'People start and stop a little early or late.','Averaging two timers cancels out some of each person’s error.'),
   mc('When can you walk out to get your rocket?',['After it lands and the teacher says it is safe','As soon as it leaves the launcher','While the teacher is pumping','Any time, if you wear goggles'],0,'Safety first.','Wait until it has landed and the teacher says it is safe.')]},
 {t:'Report',h:'Analyze and report',qt:'Project wrap-up',
  html:GOAL('Today you compare your launches, explain the physics, and turn in your project.')+
  STEPS('Analyze your flights',['Find the mean height for each fill level.','Find the percent change between the fill levels.','Explain the flight with Newton’s third law: the rocket pushes water down, so the water pushes the rocket up.','Was the flight straight? Connect it to your stability margin.','Name one change for a higher or straighter flight, and why.'])+PNT(26,'r','My analysis and notes for my presentation',5),
  qs:[mc('Which law explains how a bottle rocket lifts off?',['Newton’s third law: water is pushed down, so the rocket is pushed up','Ohm’s law','The law of conservation of mass only','Newton’s first law: objects at rest stay at rest'],0,'Action and reaction.','The rocket pushes water out the bottom, and the water pushes the rocket up with an equal force.'),
   mc('Why is filling the bottle almost full of water a bad idea?',['There is little room for air, so the thrust is short and the rocket is heavy','The rocket gets too light','The fins fall off','It makes the CG move to the nose'],0,'The compressed air does the pushing.','Air stores the energy. Too much water leaves little air and adds a lot of mass.'),
   R=>{const a=R(10,20),b=a+R(2,8);return [`At 25% fill your rocket’s mean height was ${a} m. At 35% fill it was ${b} m. What is the percent change?`,r2((b-a)/a*100),'%','(new − old) ÷ old × 100',`(${b} − ${a}) ÷ ${a} × 100 = ${r2((b-a)/a*100)}%.`];},
   R=>{const T=R(30,60)/10;return [`A flight lasted ${T} s. About how high did it go?`,r2(1.225*T*T),'m','h ≈ 1.225 × T²',`1.225 × ${r2(T*T)} = ${r2(1.225*T*T)} m.`];},
   mc('Why does 1.225 × T² slightly overestimate the height?',['It ignores air drag','It ignores gravity','It uses the wrong units','It assumes the rocket is too heavy'],0,'What slows the rocket that the formula leaves out?','The formula leaves out air drag, which makes the real flight lower.')]}
 ]});

function check(q,s,raw){

  const qa=qView(q).a, tol=Math.max(Math.abs(qa)*0.01,q.tol||0);
  if(Math.abs(v-qa)<=tol){win(s);s.val=raw;}
  else{const r=Math.log10(Math.abs(v/qa)),n=Math.round(r);
    if(!scQ(q)&&qa&&v&&Math.sign(v)===Math.sign(qa)&&n!==0&&Math.abs(r-n)<0.0045&&!s.p10){s.p10=true;s.at=Date.now();s.msg='<b>So close!</b> Your digits are right, but the decimal point is in the wrong place. Check your unit conversion or powers of ten, then try again. This one doesn’t count as a miss.';return;}
    miss(q,s,raw);}
}

  let r;try{r=Function('"use strict";return ('+j+')')();}catch(x){r=NaN;}
  H.textContent=e+' =';if(typeof r!=='number'||!isFinite(r)){I.value='Error';fresh=true;return;}
  ans=+r.toPrecision(12);I.value=String(ans);fresh=true;};
 const press=v=>{if(v==='C'){I.value='';H.textContent='';fresh=false;return;}
  if(v==='B'){I.value=fresh?'':I.value.replace(/(Ans|.)$/,'');fresh=false;return;}
  if(v==='=')return ev();
  if(fresh&&/^[0-9.π√(]|^Ans$/.test(v)){I.value='';H.textContent='';}
