<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic Engineering 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: friendly workbook on graph paper; color-coded unit tabs, then notes, a hands-on model, practice problems, and a screenshot card at the end. */
:root{
  --bg:#EEF3F6; --paper:#FFFFFF; --grid:rgba(30,90,140,.07);
  --ink:#1A2733; --muted:#5A6A78; --line:#D3DDE5; --soft:#F4F7FA;
  --mark:#F4B92A; --good:#1E8A4F; --good-soft:#DFF3E7; --bad:#C2412D; --bad-soft:#FBE4DF; --hint-soft:#E6F0FB;
  --u-lev:#E2661E; --u-pul:#0E8C88; --u-gear:#7A4FD0; --u-elec:#1F6FD6; --u-sum:#1A2733;
  --u:var(--u-lev);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111920; --paper:#18222B; --grid:rgba(120,180,230,.05);
  --ink:#E6EDF2; --muted:#9AABB8; --line:#2E3C48; --soft:#1F2B35;
  --mark:#F4B92A; --good:#5DCB8E; --good-soft:#163222; --bad:#F08670; --bad-soft:#3B1E18; --hint-soft:#182B40;
  --u-lev:#F58A47; --u-pul:#3BC2BC; --u-gear:#A685F0; --u-elec:#5EA0F2; --u-sum:#E6EDF2; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111920; --paper:#18222B; --grid:rgba(120,180,230,.05);
  --ink:#E6EDF2; --muted:#9AABB8; --line:#2E3C48; --soft:#1F2B35;
  --mark:#F4B92A; --good:#5DCB8E; --good-soft:#163222; --bad:#F08670; --bad-soft:#3B1E18; --hint-soft:#182B40;
  --u-lev:#F58A47; --u-pul:#3BC2BC; --u-gear:#A685F0; --u-elec:#5EA0F2; --u-sum:#E6EDF2; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.3rem,7vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.7rem,5vw,2.2rem);font-weight:800}
h3{font-size:1.35rem;font-weight:700;color:var(--u)}
p{margin:0}
strong{font-weight:600}
.eyebrow{font-family:var(--f-body);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-direction:column;gap:10px}
header .sub{color:var(--muted);max-width:60ch}
.meter{display:flex;align-items:center;gap:12px;font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--mark);transition:width .5s}

nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){nav.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}nav.tabs .tab:last-child{grid-column:1/-1}}
.tab{--u:var(--u-lev);font-family:var(--f-display);font-size:1.15rem;font-weight:700;background:var(--paper);color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:6px 12px 4px;min-height:56px;cursor:pointer;display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:center;justify-content:center;touch-action:manipulation;line-height:1.1}
.tab small{grid-column:2}
.tab small{font-family:var(--f-body);font-size:.75rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--u);flex:none}
.tab[aria-selected="true"]{border-color:var(--u);box-shadow:0 3px 0 var(--u)}
.tab.done small{color:var(--good)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--u);outline-offset:2px}

.sheet{background:var(--paper);border:2px solid var(--line);border-top:8px solid var(--u);border-radius:20px;padding:clamp(18px,4vw,34px);display:flex;flex-direction:column;gap:24px}
.lesson{display:flex;flex-direction:column;gap:16px;max-width:66ch}
.bigidea{font-size:1.15rem;line-height:1.55}
.lesson ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.mg{background:var(--soft);border-radius:16px;padding:14px}
.mg h3{margin:0 0 4px}.mg .mgtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.mg .mgtop p{margin:0;font-size:.9rem;color:var(--muted)}.mg .mgcount{font-weight:600;font-variant-numeric:tabular-nums}
.mgcols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px 10px;align-items:stretch}
.mgcol{display:flex;flex-direction:column;gap:8px}
.mgi{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 11px;font:inherit;font-size:.9rem;line-height:1.3;cursor:pointer;touch-action:manipulation;min-height:44px}
.mgi.t{font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--u)}
.mgi:hover:not(:disabled){border-color:var(--u)}
.mgi[aria-pressed="true"]{border-color:var(--u);background:color-mix(in srgb,var(--u) 16%,var(--paper))}
.mgi.ok{border-color:var(--good);background:var(--good-soft);color:var(--ink);cursor:default}
.mgi.t.ok{color:var(--good)}
.mgi.no{border-color:var(--bad);background:var(--bad-soft);animation:mgshake .3s}
@keyframes mgshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mgi.no{animation:none}}
.mgdone{margin-top:10px;font-weight:600;color:var(--good)}
.mgreset{margin-top:10px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;padding:4px 0}
@media (max-width:560px){.mgcols{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}.mgi{font-size:.82rem;padding:8px}.mgi.t{font-size:.9rem}}
.sg{background:var(--soft);border-radius:16px;padding:14px;margin-top:16px}
.sg h3{margin:0 0 4px}.sg .mgtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sg .mgtop p{margin:0;font-size:.9rem;color:var(--muted)}.sg .mgcount{font-weight:600;font-variant-numeric:tabular-nums}
.sgcard{background:var(--paper);border:2px solid var(--u);border-radius:14px;padding:16px;text-align:center}
.sgcard small{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.sgcard b{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.sgopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.sgo{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 6px;font-family:var(--f-display);font-weight:600;font-size:1rem;cursor:pointer;min-height:48px;touch-action:manipulation}
.sgo:hover:not(:disabled){border-color:var(--u)}
.sgo.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.sgo.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.sgo:disabled{cursor:default}
.sgfb{margin-top:10px;font-size:.95rem}.sgfb.good{color:var(--good)}.sgfb.bad{color:var(--bad)}
.sgnext{margin-top:10px;display:flex;justify-content:flex-end}
@media (max-width:560px){.sgopts{grid-template-columns:repeat(2,minmax(0,1fr))}.sgcard b{font-size:1.15rem}}
.dcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--u);border-radius:12px;padding:10px 12px}
.dcard h4{margin:0 0 4px;font-family:var(--f-display);font-size:1.12rem;color:var(--u);line-height:1.15}
.dcard p{margin:0 0 5px;font-size:.9rem;line-height:1.4}.dcard p:last-child{margin:0}
.dcard span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:620px){.dcards{grid-template-columns:minmax(0,1fr)}}
.fc{background:var(--soft);border-radius:16px;padding:14px;margin-top:16px}
.fc h3{margin:0 0 4px}.fc .mgtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.fc .mgtop p{margin:0;font-size:.9rem;color:var(--muted)}.fc .mgcount{font-weight:600;font-variant-numeric:tabular-nums}
.fcbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}.fcbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.fccard{display:block;width:100%;perspective:1000px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation}
.fcin{position:relative;display:grid;min-height:190px;transition:transform .45s;transform-style:preserve-3d}
.fccard[aria-pressed="true"] .fcin{transform:rotateY(180deg)}
.fcf,.fcb{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 18px;border-radius:16px;border:2px solid var(--u);background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.fcb{transform:rotateY(180deg);background:color-mix(in srgb,var(--u) 10%,var(--paper))}
.fcf b{font-family:var(--f-display);font-size:1.7rem;line-height:1.15;color:var(--u)}
.fcb p{margin:0;font-size:1.1rem;line-height:1.45}.fcb b{font-family:var(--f-display);color:var(--u)}
.fcf small,.fcb small{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fccard:focus-visible .fcf,.fccard:focus-visible .fcb{outline:3px solid var(--u);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.fcin{transition:none}}
.fcact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.fcact .btn{width:100%;justify-content:center}
.fcnote{margin:10px 0 0;font-size:.85rem;color:var(--muted);text-align:center}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.vocab div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.disc{display:grid;grid-template-columns:minmax(120px,190px) 1fr;margin:0;border:2px solid var(--line);border-radius:14px;overflow:hidden}.disc dt,.disc dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}.disc dt:first-of-type,.disc dt:first-of-type+dd{border-top:0}.disc dt{background:var(--soft);font-family:var(--f-display);font-weight:700;color:var(--u)}.disc dd b{color:var(--u)}
@media (max-width:520px){.disc{grid-template-columns:1fr}.disc dd{border-top:0;padding-top:0}}
.vocab b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--u)}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{border:2px solid var(--u);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.rule b{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.rule span{font-size:.9rem;color:var(--muted)}
.example{border-radius:14px;background:color-mix(in srgb,var(--mark) 16%,var(--paper));padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.example .eyebrow{color:var(--ink)}
.steps{font-family:var(--f-mono);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
code,.mono{font-family:var(--f-mono);font-size:.9em}
.fig{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fig svg{width:100%;height:auto;max-width:min(100%,540px);display:block;margin:0 auto}
.fig .cap{font-size:.88rem;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-weight:500;font-size:.9rem}
.ctrl input[type=range]{flex:1;min-width:160px;height:32px;accent-color:var(--u)}
@media (min-width:700px) and (max-width:1100px){.wrap{max-width:none;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}body{font-size:18px}}
@media (hover:none){.choice:hover:not(:disabled){border-color:var(--line)}}
.readout{display:flex;flex-wrap:wrap;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums}
.readout span{background:var(--soft);border-radius:99px;padding:3px 12px}
.readout b{color:var(--u);font-weight:600}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.classes div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.classes strong{font-family:var(--f-display);font-size:1.2rem;display:block;color:var(--u)}

.setHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:18px}
.qs{display:flex;flex-direction:column;gap:12px}
.q{border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.q.ok{border-color:var(--good)}
.q.rev{border-color:var(--mark)}
.qtop{display:flex;gap:12px;align-items:flex-start}
.qid{font-family:var(--f-display);font-weight:700;font-size:1rem;flex:none;width:2.6em;height:2.2em;border-radius:10px;background:var(--soft);color:var(--u);display:grid;place-items:center}
.qtext{flex:1;min-width:0;padding-top:.15em}
.pill{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;flex:none}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.rev{background:color-mix(in srgb,var(--mark) 25%,var(--paper));color:var(--ink)}
.ans,.choices,.fb{padding-left:calc(2.6em + 12px)}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input[type=text]{font-family:var(--f-mono);font-size:1.1rem;width:8em;min-height:44px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.ans input[type=text]:focus{border-color:var(--u)}
.unit{font-weight:500;color:var(--muted)}
button.btn{min-height:44px;touch-action:manipulation;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:6px 16px 4px;border:2px solid var(--u);border-radius:12px;background:var(--u);color:#fff;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.btn.locked,button.btn:disabled{background:var(--line);border-color:var(--line);color:var(--ink);opacity:.5;cursor:not-allowed;filter:grayscale(1)}
.lockmsg{margin:6px 0 0;font-size:.85rem;opacity:.7;text-align:right}
.celebrate{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding:14px 18px;border-radius:16px;background:color-mix(in srgb,var(--good) 16%,var(--paper));border:3px solid var(--good);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate .big{flex:none;width:52px;height:52px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:1.9rem;font-weight:800}
.celebrate strong{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--good);line-height:1.1}
.celebrate span{font-size:.95rem}
#doneArea .sub-card{box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 35%,transparent);animation:pop .45s .1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.celebrate,#doneArea .sub-card{animation:none}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:44px;touch-action:manipulation;font-family:var(--f-body);font-size:.95rem;padding:8px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.choice:hover:not(:disabled){border-color:var(--u)}
.choice.picked-bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.choice.picked-ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.choice:disabled{cursor:default}
.fb{font-size:.95rem}
.fb.bad{color:var(--bad)}
.hint,.sol{margin-left:calc(2.6em + 12px);font-size:.95rem;padding:10px 14px;border-radius:12px}
.hint{background:var(--hint-soft)}
.sol{background:var(--good-soft);color:var(--ink)}
.q.rev .sol{background:color-mix(in srgb,var(--mark) 15%,var(--paper))}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.sub-card{border:3px solid var(--u);border-radius:20px;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}
.sub-card .sc-head{background:var(--u);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px}
.sub-card .sc-head h3{color:#fff;font-size:1.45rem}
.sub-card .sc-head span{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.sc-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.sc-row{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end}
.sc-field{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc-field label,.sc-field .lbl{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc-field input{font-family:var(--f-display);font-size:1.5rem;font-weight:700;border:none;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:2px 0;width:min(320px,80vw)}
.sc-field input::placeholder{color:var(--muted);font-weight:600}
.sc-field .val.attn b{font-size:1.5rem;font-family:var(--f-display)}
.sc-field .val{font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.sc-bar{display:flex;align-items:center;gap:14px}
.sc-bar .bar{height:28px}
.sc-bar .bar>i{background:var(--u)}
.sc-bar .num{font-family:var(--f-display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;min-width:3em;text-align:right}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.chip{font-size:.82rem;font-weight:600;padding:5px 6px;border-radius:10px;border:2px solid var(--line);text-align:center;color:var(--muted)}
.chip.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chip.rev{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 22%,var(--paper));color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.stamp{position:absolute;right:18px;top:60px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--good);border:3px solid var(--good);border-radius:12px;padding:0 12px;transform:rotate(-6deg);background:var(--paper)}
.cheer{font-family:var(--f-display);font-size:1.2rem;font-weight:700;color:var(--good)}

.jump{font-size:.85rem;font-weight:500;color:var(--u);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font-family:var(--f-body)}
svg text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
@media (max-width:520px){.ans,.choices,.fb{padding-left:0}.hint,.sol{margin-left:0}.stamp{top:auto;bottom:14px}}

 vocab:[['Effort','The force you put into a machine.'],['Load','The force or weight a machine moves.'],['Work','Force × distance moved, in joules (J).'],['Pulley','A wheel with a grooved rim that guides a rope.'],['Block and tackle','Fixed and movable pulleys working together to lift heavy loads.'],['Wheel and axle','A large wheel fixed to a smaller axle so they turn together.'],['Third-class lever','A lever with the effort between the fulcrum and the load. Its MA is less than 1.']],
 banner:PB('How simple machines work','A simple machine does not make energy. It trades force for distance: you push with less force over a longer distance, and the load moves a shorter distance with more force. In a perfect machine, work in = work out, so effort × effort distance = load × load distance.')+`<h3>How levers, pulleys and wheels work</h3><div class="mtypes">
  <div><b>First-class lever</b>The fulcrum sits between the effort and the load. Push one end down and the other end goes up.<i>Seesaw, crowbar, scissors, pliers.</i></div>
  <div><b>Second-class lever</b>The load sits between the fulcrum and the effort. The effort arm is always longer, so MA is always more than 1.<i>Wheelbarrow, nutcracker, bottle opener.</i></div>
  <div><b>Third-class lever</b>The effort sits between the fulcrum and the load. MA is less than 1: you push harder, but the load moves farther and faster.<i>Tweezers, a fishing rod, a baseball bat, your forearm.</i></div>
  <div><b>Fixed pulley</b>Bolted in place. It does not reduce the force (MA = 1), but it changes the direction, so you can pull down to lift up.<i>Flagpole, window blinds.</i></div>
  <div><b>Movable pulley</b>Hangs on the rope and rises with the load. Two rope segments hold the load, so you pull with half the force but pull twice as much rope.<i>Construction hoists.</i></div>
  <div><b>Block and tackle</b>Fixed and movable pulleys together. Ideal MA = the number of rope segments holding up the load. More segments means less effort and more rope to pull.<i>Cranes, sailboats, engine hoists.</i></div>
  <div><b>Wheel and axle</b>A big wheel turns a small axle. Turning the wheel multiplies your force by wheel radius ÷ axle radius.<i>Steering wheel, doorknob, screwdriver, well winch.</i></div></div>`,
 extra:WE('A block and tackle has 4 rope segments holding a 600 N engine. What effort lifts it, and how much rope do you pull to raise it 0.5 m?',['Ideal MA = 4 segments','Effort = 600 ÷ 4 = 150 N','Rope pulled = 4 × 0.5 = 2 m'])+WE('A 300 N child sits 2 m from a seesaw pivot. Where must a 400 N child sit to balance?',['300 × 2 = 400 × d','600 = 400d','d = 600 ÷ 400 = 1.5 m']),

U(7,'Gears, step-up gearing and efficiency','gear ratios, step-up and step-down trains, torque and efficiency','Gears trade speed for torque. Energy is never destroyed, but friction turns some into heat, so real machines are less than 100% efficient.',
 [['Gear ratio','Driven teeth ÷ driver teeth.'],['Efficiency','Useful work out ÷ energy in.'],['Kinetic energy','Energy of motion.'],['Potential energy','Stored energy from height.'],['Friction','A force that resists motion.']],
 [['Gear ratio = driven teeth ÷ driver teeth','Above 1 means slower output and more torque.'],['Efficiency = useful output ÷ input × 100','Always below 100%.'],['KE = ½mv² · PE = mgh','g = 9.8 m/s².']],

 vocab:[['Driver gear','The gear turned by the motor or by you.'],['Driven gear','The gear turned by the driver gear.'],['Step-down gearing','A small gear driving a larger one: slower output with more torque.'],['Step-up gearing','A large gear driving a smaller one: faster output with less torque.'],['Idler gear','A gear between two others that changes the direction but not the ratio.'],['Compound gear train','Several gear stages linked together. Their ratios multiply.']],
 banner:PB('How gears work','Gears are wheels with teeth that lock together. When two gears mesh, their teeth pass each other at the same rate, so the gear with fewer teeth has to spin more times to keep up. Meshing gears always turn in opposite directions. Gears trade speed for torque: when the output gets faster, its torque goes down by the same factor (minus a little lost to friction).')+`<h3>Kinds of gearing</h3><div class="mtypes">
  <div><b>Step-down (reduction)</b>A small driver turns a big driven gear. The output turns slower with more torque. Ratio = driven ÷ driver, more than 1.<i>Clocks, winches, robot wheels, a drill in low gear.</i></div>
  <div><b>Step-up (overdrive)</b>A big driver turns a small driven gear. The output spins faster with less torque. Times faster = driver teeth ÷ driven teeth.<i>Bike chainring to rear cog, hand-crank egg beater, wind turbine gearbox (slow blades, fast generator).</i></div>
  <div><b>Idler gear</b>A gear placed between the driver and the driven gear. It does not change the speed ratio. It only makes the output turn the same direction as the driver.<i>Printer rollers, gear pumps.</i></div>
  <div><b>Compound gear train</b>Two gears share one shaft, so one stage drives the next. Multiply the stage ratios: a 4 : 1 stage then a 3 : 1 stage gives 12 : 1.<i>Clocks, car transmissions, gearmotors.</i></div>
  <div><b>Chain and sprockets</b>Same tooth math as gears, but the sprockets can be far apart and both turn the same direction.<i>Bicycles, motorcycles, conveyors.</i></div></div>`,
 extra:WE('A bike has a 48-tooth chainring and a 16-tooth rear cog. You pedal at 60 RPM. How fast does the rear wheel turn?',['Step-up: 48 ÷ 16 = 3 times faster','Wheel = 60 × 3 = 180 RPM'])+WE('A 20-tooth gear spins at 300 RPM and drives a 50-tooth gear. How fast does the big gear turn?',['N₁ × T₁ = N₂ × T₂','300 × 20 = N₂ × 50','6,000 = 50 N₂, so N₂ = 6,000 ÷ 50 = 120 RPM']),
 items:['Choose tooth counts for a 12 : 1 gear train','Model the gears in Tinkercad and check they mesh','Build the clock from the model','Test it for 10 minutes and measure the drift'],

 lab:TC('Model the gears',['Search the Shapes panel for “Gear” and drag two gears onto the Workplane.','Set the number of teeth on each gear to match your plan, for example 12 and 48 teeth for 4 : 1, then 12 and 36 for 3 : 1. Gears that mesh need the same tooth size.','Move one gear until its teeth fit between the other’s teeth without overlapping, and check the spacing with the Ruler tool.','Repeat for the second stage and group each shaft with its gear. Use the finished model as the plan for the real clock.']),

  mc('A 40-tooth gear drives a 10-tooth gear. What kind of gearing is this?',['Step-up: faster output, less torque','Step-down: slower output, more torque','Idler: same speed, opposite direction','It cannot turn at all'],0,'A big gear is driving a small gear.','A big driver turns the small gear 4 times faster with a quarter of the torque.'),

  nm('A bike has a 48-tooth chainring and a 16-tooth rear cog. You pedal at 60 RPM. How fast does the rear wheel turn?',180,'RPM','Times faster = 48 ÷ 16.','48 ÷ 16 = 3, and 60 × 3 = 180 RPM.'),

U(8,'Circuits, AC/DC, Ohm’s law, series and parallel','calculating current, voltage drops, power and solving Ohm’s law for any variable','Electricity comes in two forms. Direct current (DC) flows one way, like the current from a battery. Alternating current (AC) switches direction back and forth many times a second, like the current from a wall outlet. Voltage pushes current through a circuit and resistance holds it back. Ohm’s law links all three, so knowing two lets you solve for the third. In a series circuit the current has one path, so resistances add. In a parallel circuit current splits between branches, which lowers the total resistance.',
 [['Voltage (V)','The electrical push, in volts.'],['Current (I)','Flow of charge, in amps.'],['Resistance (R)','Opposition to current, in ohms.'],['Insulator','A material that blocks current.'],['Series circuit','One path for current.'],['Parallel circuit','Branches that share current.'],['Power','The rate energy is used, in watts.'],['Microcontroller','A tiny programmable computer.'],['Direct current (DC)','Current that flows in one direction only, like the current from a battery or solar cell.'],['Alternating current (AC)','Current that switches direction back and forth many times every second, like the current from a wall outlet.'],['Frequency','How many full back-and-forth cycles AC makes each second, measured in hertz (Hz).'],['Transformer','A device that raises or lowers an AC voltage using two coils of wire.'],['Adapter (charger)','A device that turns wall-outlet AC into the low-voltage DC that electronics need.']],
 [['V = I × R','Ohm’s law.'],['I = V ÷ R · R = V ÷ I','The same law, rearranged.'],['P = V × I','Power in watts.'],['Series: R = R₁ + R₂','Resistors in a line add up.'],['Parallel: 1 ÷ R = 1 ÷ R₁ + 1 ÷ R₂','Two equal resistors give half the resistance.'],['Energy = power × time','Watt-hours (Wh).'],['DC flows one way · AC flips back and forth','US outlets give about 120 V AC at 60 Hz. Much of the world uses 230 V at 50 Hz. Batteries give DC.'],['Cycles = frequency × time · Period = 1 ÷ frequency','60 Hz means 60 cycles every second, so one cycle lasts 1 ÷ 60 ≈ 0.017 s.'],['Transformer: output voltage = input voltage ÷ turns ratio','A 10 : 1 step-down transformer turns 120 V AC into 12 V AC.']],

 banner:PB('Tinkercad Circuits','This chapter is short and hands-on. You will learn Ohm’s law, series and parallel circuits, and power, then build and test each circuit in Tinkercad Circuits, which runs in your web browser. A mistake only burns out a virtual LED.')+PB('AC and DC: two kinds of current','<b>Direct current (DC)</b> flows in one direction around the circuit, always the same way. Batteries, solar cells, USB ports and the electronics inside your phone and laptop all use DC. <b>Alternating current (AC)</b> switches direction back and forth. In the United States the outlets in your wall give about 120 V AC that flips 60 times every second (60 Hz). In the 1880s Thomas Edison pushed for DC power grids while Nikola Tesla and George Westinghouse pushed for AC. AC won for the grid because a <b>transformer</b> can raise its voltage very high for long power lines, which wastes less energy, and then lower it again before it reaches your home. Today most devices use both: a charger, or adapter, turns the outlet’s AC into low-voltage DC. Some very long modern power lines and electric-car fast chargers use high-voltage DC again.')+`<div class="fig"><span class="eyebrow">Graph · DC vs. AC over time</span><svg viewBox="0 0 380 150" role="img" aria-label="DC is a flat line above zero. AC is a wave that rises above zero and falls below it, over and over."><line x1="30" y1="75" x2="370" y2="75" stroke="var(--muted)" stroke-dasharray="3 3"/><line x1="30" y1="10" x2="30" y2="140" stroke="var(--ink)"/><text x="26" y="79" text-anchor="end" font-size="11" fill="var(--muted)">0</text><text x="370" y="146" text-anchor="end" font-size="11" fill="var(--muted)">time →</text><line x1="30" y1="24" x2="370" y2="24" stroke="var(--mark)" stroke-width="4"/><text x="40" y="16" font-size="12" font-weight="600" fill="var(--ink)">DC: steady, one direction</text><path d="${Array.from({length:69},(_,i)=>(i?'L':'M')+(30+i*5)+' '+(75-38*Math.sin(i*5/340*4*2*Math.PI)).toFixed(1)).join(' ')}" fill="none" stroke="var(--u)" stroke-width="3"/><text x="40" y="146" font-size="12" font-weight="600" fill="var(--ink)">AC: flips above and below zero</text></svg><p class="cap">The DC line stays on one side of zero. The AC wave crosses zero again and again: current flows one way, then the other. At 60 Hz the wave repeats 60 times every second.</p></div>`,

U(9,'Flight: airfoils, lift and drag','wing area, wing loading, the lift formula and square roots','Four forces act on an aircraft: lift up, weight down, thrust forward, and drag back. A wing turns the oncoming air downward, so the air pushes the wing up. Lift grows with wing area and with the square of the speed, and in level flight lift equals weight.',
 [['Lift','The upward force made by air flowing over a wing.'],['Drag','Air resistance that slows motion.'],['Thrust','The forward force from a propeller or engine.'],['Wing area','The surface area of the wing, in m².'],['Glide ratio','Distance traveled forward for each unit of height lost.']],
 [['Lift = ½ × ρ × v² × S × CL','ρ = 1.2 kg/m³ for air, v = speed in m/s, S = wing area in m², and CL is the lift coefficient (given).'],['Doubling the speed makes 4 times the lift','Speed is squared, so 2² = 4.'],['Level flight: lift = weight','Weight = mass × 9.8.'],['Glide ratio = distance ÷ height lost','A ratio of 15 means 15 m forward for every 1 m of height lost.']],

 banner:PB('Wings and airfoils','An <b>airfoil</b> is the shape you see if you slice a wing from front to back. Its rounded front is the <b>leading edge</b>, its thin back is the <b>trailing edge</b>, and the straight line between them is the <b>chord line</b>. The top is curved more than the bottom; that curve is the <b>camber</b>. The wing meets the air tilted up slightly; that tilt is the <b>angle of attack</b>. Air flowing over the curved top speeds up and its pressure drops (Bernoulli’s principle), and the tilted wing pushes air downward, so the air pushes the wing up (Newton’s third law). Tilt it too far, about 15°, and the air peels away from the top of the wing. Lift collapses: that is a <b>stall</b>.')+`<div class="fig"><span class="eyebrow">Diagram · Parts of an airfoil</span><svg viewBox="0 0 380 180" role="img" aria-label="A wing cross-section tilted up slightly, with the leading edge, trailing edge, chord line, angle of attack, lift, drag and relative wind labeled"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker></defs><line x1="70" y1="100" x2="175" y2="100" style="stroke:var(--muted)" stroke-dasharray="3 3"/><g transform="rotate(-8 70 100)"><path d="M70 100 C78 72 150 62 215 70 C265 77 300 92 320 100 C290 103 210 108 140 109 C100 110 72 108 70 100Z" style="fill:var(--u);opacity:.85"/><line x1="70" y1="100" x2="320" y2="100" style="stroke:var(--ink)" stroke-dasharray="6 4" stroke-width="1.5"/></g><path d="M165 100 A95 95 0 0 0 164.1 86.8" fill="none" style="stroke:var(--mark)" stroke-width="3"/><text x="172" y="100" font-size="12" font-weight="600" style="fill:var(--ink)">α</text><line x1="8" y1="100" x2="56" y2="100" style="stroke:var(--muted)" stroke-width="2" marker-end="url(#ah)"/><line x1="8" y1="124" x2="56" y2="124" style="stroke:var(--muted)" stroke-width="2" marker-end="url(#ah)"/><text x="8" y="144" font-size="11" style="fill:var(--ink)">Relative wind</text><line x1="195" y1="74" x2="195" y2="18" style="stroke:var(--good)" stroke-width="4" marker-end="url(#ah)"/><text x="204" y="26" font-size="12" font-weight="600" style="fill:var(--ink)">Lift</text><line x1="326" y1="66" x2="370" y2="66" style="stroke:var(--ink)" stroke-width="3" marker-end="url(#ah)"/><text x="348" y="84" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">Drag</text><text x="14" y="80" font-size="11" style="fill:var(--ink)">Leading edge</text><text x="372" y="46" font-size="11" text-anchor="end" style="fill:var(--ink)">Trailing edge</text><text x="120" y="160" font-size="11" style="fill:var(--muted)">Dashed line: chord · α: angle of attack</text></svg><p class="cap">The curved top is the camber. The angle between the chord line and the oncoming air (the relative wind) is the angle of attack.</p></div>`,

U(10,'Rockets: thrust, impulse and flight','F = ma, impulse, burnout and coast height, and stability','A rocket moves because it throws hot gas downward and the gas pushes the rocket upward (Newton’s third law). It lifts off only when thrust is greater than its weight, and the leftover force makes it speed up. To stay in low Earth orbit, a spacecraft must also move sideways at about 7.8 km/s.',
 [['Thrust-to-weight ratio','Thrust ÷ weight. It must be above 1 to lift off.'],['Net force','Thrust minus weight, the force left over to speed the rocket up.'],['Newton’s third law','Every action has an equal and opposite reaction.'],['Payload','The cargo a rocket carries, such as a satellite.'],['Orbit','A path around a planet where an object keeps falling around it without hitting it.']],
 [['Weight = mass × 9.8','In newtons, with mass in kg.'],['Net force = thrust − weight · acceleration = net force ÷ mass','Valid near liftoff, ignoring drag.'],['Thrust-to-weight ratio = thrust ÷ weight','Above 1 the rocket lifts off.'],['Speed gained = acceleration × time','In m/s.'],['Low Earth orbit speed ≈ 7.8 km/s','About 28,000 km/h. Distance = speed × time still works.']],
 'A model rocket has a mass of 1 kg and its motor gives 30 N of thrust. What is its acceleration at liftoff? (use 9.8, ignore drag)',['Weight = 1 × 9.8 = 9.8 N','Net force = 30 − 9.8 = 20.2 N','Acceleration = 20.2 ÷ 1 = 20.2 m/s²'],'rocket',

  nm('An engine gives 3,000 N of thrust to a rocket that weighs 1,500 N. What is the thrust-to-weight ratio?',2,'','Thrust ÷ weight.','3000 ÷ 1500 = 2.'),
  nm('A satellite moves at 7.8 km/s in low Earth orbit. How far does it travel in 100 s?',780,'km','Distance = speed × time.','7.8 × 100 = 780 km.')],
 {vocab:[['Total impulse','Average thrust × burn time, in newton-seconds (N·s).'],['Burnout','The moment the motor stops burning.'],['Apogee','The highest point of the flight.'],['Center of gravity (CG)','The rocket’s balance point.'],['Center of pressure (CP)','The point where the air’s push on the rocket is centered.'],['Stability margin','The distance from CG to CP divided by the body diameter, in calibers.'],['Recovery system','The parachute or streamer that brings the rocket down safely.']],
 rules:[['Total impulse = average thrust × burn time','Burn time = impulse ÷ thrust.'],['Speed at burnout = a × t','Starting from rest.'],['Height at burnout ≈ ½ × a × t²','Square t first.'],['Coast height ≈ v² ÷ (2 × 9.8)','Extra height after burnout, ignoring drag.'],['Time from burnout to apogee = v ÷ 9.8','Gravity takes away 9.8 m/s every second.'],['Apogee ≈ burnout height + coast height','Real rockets go a bit lower because of drag.'],['Stability margin = (CP − CG) ÷ diameter','1 to 2 calibers is stable. Below 1 the rocket can tumble.'],['Descent time = height ÷ descent speed','For a rocket under its parachute.']],
 banner:PB('The four stages of a rocket flight','<b>Boost:</b> the motor burns and pushes the rocket up faster and faster. <b>Coast:</b> at burnout the motor stops, and gravity and drag slow the rocket while it keeps climbing. <b>Apogee:</b> the highest point, where the upward speed reaches zero. <b>Recovery:</b> a small ejection charge pops out a parachute or streamer so the rocket lands softly.')+`<h3>Reading a model rocket motor</h3><div class="mtypes">
  <div><b>The code C6-5</b>C is the total impulse class. 6 is the average thrust in newtons. 5 is the delay, in seconds, from burnout to the ejection charge.<i>Heavier, slower rockets need a shorter delay.</i></div>
  <div><b>Impulse classes</b>A: up to 2.5 N·s · B: up to 5 N·s · C: up to 10 N·s · D: up to 20 N·s. Each letter allows up to twice the impulse of the one before.<i>Bigger letters fly higher and need bigger launch fields.</i></div>
  <div><b>Stability: CG ahead of CP</b>The center of gravity must be closer to the nose than the center of pressure. A gap of 1 to 2 body diameters (calibers) is stable.<i>Add nose weight to move the CG forward. Bigger fins move the CP back.</i></div></div>`,
 extra:WE('A model rocket accelerates at 20 m/s² for 1.5 s. Estimate its apogee, ignoring drag.',['Burnout speed = 20 × 1.5 = 30 m/s','Burnout height = ½ × 20 × 1.5² = 10 × 2.25 = 22.5 m','Coast height = 30² ÷ 19.6 = 900 ÷ 19.6 ≈ 45.9 m','Apogee ≈ 22.5 + 45.9 = 68.4 m']),
 qs:[mc('In the motor code C6-5, what does the letter C tell you?',['The total impulse class','The average thrust','The ejection delay','The motor’s diameter'],0,'The letter comes first.','The letter is the impulse class. 6 is the average thrust in N and 5 is the delay in seconds.'),
  mc('Each motor class letter (A, B, C, D…) allows how much total impulse compared with the one before it?',['Up to twice as much','The same amount','Ten times as much','Half as much'],0,'A tops out at 2.5 N·s and B at 5 N·s.','Each letter doubles the maximum total impulse.'),
  mc('For a model rocket to fly straight, where must the center of gravity (CG) be?',['Closer to the nose than the center of pressure','Behind the center of pressure','Exactly on the center of pressure','At the very bottom of the fins'],0,'Think of a dart or an arrow.','With the CG ahead of the CP, the air pushes the tail back in line so the rocket points into the wind.'),
  nm('A motor averages 6 N of thrust for 1.5 s. What is its total impulse?',9,'N·s','Impulse = thrust × time.','6 × 1.5 = 9 N·s.')],

U(11,'Matter, mixtures, reactions and pH','percentages, ratios, dilution, exponents and yield','Chemical engineers work with matter in many forms. Mixtures can be separated by their properties, and concentration tells you how much of a substance is in a solution. In a reaction atoms are rearranged, never lost, so mass in equals mass out. The pH scale uses powers of ten to measure acidity, and real processes never reach 100% yield.',

U(22,'Motors: how they run','rates, ratios, power and efficiency','A motor turns electrical energy into motion. Every electric motor uses the same idea: current flowing through a coil of wire makes an electromagnet, and magnets push and pull on each other. The part that stays still is the stator and the part that spins is the rotor. What makes one motor different from another is how it switches its magnets on and off to keep the rotor turning, which is why a toy car, a drone, a 3D printer, a robot arm and a washing machine each use a different kind.',
 [['Electromagnet','A coil of wire that becomes a magnet while current flows through it.'],['Stator','The part of a motor that stays still.'],['Rotor','The part of a motor that spins.'],['Commutator','A split ring that flips the current in the coil every half turn so the rotor keeps spinning.'],['Brushed DC motor','A simple, cheap motor where carbon brushes rub on a split ring to switch the current. Found in toys and small fans.'],['Brushless DC motor','A motor whose coils are switched by an electronic controller instead of brushes. Efficient and long-lasting, used in drones and electric cars.'],['Stepper motor','A motor that turns in small, exact steps, used in 3D printers and CNC machines.'],['Servo motor','A motor with a position sensor and controller that moves to an exact angle and holds it, used in robot arms and RC car steering.'],['AC induction motor','A motor that runs on alternating current. The changing magnetic field in the stator drags the rotor around. Used in fans, pumps and washing machines.'],['RPM','Revolutions per minute: how many full turns a shaft makes in one minute.']],
 [['Turns per second = RPM ÷ 60','3,000 RPM is 50 full turns every second.'],['Stepper angle = 360° ÷ steps per revolution','A 200-step motor moves 1.8° per step. Steps needed = angle ÷ degrees per step.'],['Electrical power in: P = V × I','In watts.'],['Efficiency = mechanical power out ÷ electrical power in × 100','Small hobby motors are often 50% to 80% efficient. Large factory motors can reach 95%.'],['Gearbox: output speed = motor speed ÷ gear ratio','Motors spin fast with little torque. A gearbox trades speed for torque.'],['A DC motor’s speed is about proportional to its voltage','Double the voltage and the no-load speed roughly doubles. Swap the battery wires and it spins the other way.']],

 {tag:'Motor investigation',noun:'motor investigation',
 banner:PB('Engines and motors','An engine burns fuel, like the gasoline engine in many cars. A motor usually means an electric motor. This section is about electric motors, which run everything from your phone’s vibration buzzer to electric trains.')+`<h3>How the main types of motor run</h3><div class="mtypes">
  <div><b>Brushed DC motor</b>Permanent magnets sit in the stator. Current flows through carbon brushes into a coil on the rotor, which becomes an electromagnet and gets pushed around by the magnets. A split ring called a commutator flips the current every half turn so the push keeps going the same way.<i>Simple and cheap, but the brushes wear out. Toys, small fans, car windows.</i></div>
  <div><b>Brushless DC motor</b>The magnets are on the rotor and the coils are on the stator. An electronic controller switches the coils on one after another, making a magnetic field that rotates and pulls the rotor along.<i>No rubbing parts, so efficient, quiet and long-lasting. Drones, electric cars, computer fans.</i></div>
  <div><b>Stepper motor</b>A controller energizes the coils in a set order, one small step at a time. The rotor snaps to each new position, so the controller knows the exact angle just by counting steps.<i>Precise positioning without a sensor. 3D printers, CNC machines, camera sliders.</i></div>
  <div><b>Servo motor</b>A small motor, a gearbox, a position sensor and a controller in one package. You tell it an angle, it moves there, checks the sensor, and holds that position.<i>Exact angles. Robot arms, RC car steering, animatronics.</i></div>
  <div><b>AC induction motor</b>Alternating current in the stator coils makes a magnetic field that spins around. That field induces currents in the rotor, which turn it into a magnet that chases the spinning field. Its speed is set by the AC frequency.<i>Rugged, no brushes, runs straight from the wall. Washing machines, pumps, fans, factories.</i></div>
  <div><b>Gearmotor</b>Any of the motors above with a gearbox attached. The motor spins fast with little torque, and the gears trade that speed for the torque needed to move a wheel or arm.<i>Robot wheels, garage door openers, the motors in your clock project.</i></div></div>`,

 const h1=H(1,'Engineering disciplines overview')+
  `<div class="example"><span class="eyebrow">Chapter goal</span><p>This chapter introduces the six engineering disciplines, basic engineering math, measurements, and the engineering design process. It prepares you for the specialized chapters that follow, starting with Civil Engineering in Chapter 2.</p></div>
  ${EQ('What are the major fields of engineering and what problems do they solve?','you can explain the purpose of each engineering discipline and spot examples of each in everyday life.')}
  <h3>What is engineering?</h3><p class="bigidea">Engineering is using science, math and creativity to design solutions to real-world problems. Scientists ask <i>why</i> something happens; engineers ask <i>how can we use that to solve a problem?</i></p>
  <h3>How engineers solve problems</h3><p>Every engineering job starts with a need. Engineers describe what the solution must do (its <b>criteria</b>) and the limits they must work within (its <b>constraints</b>), such as cost, size and time. Then they follow the <b>Engineering Design Process</b>: research, brainstorm, build a prototype, test it, and improve it until it works. You will study that process in Lesson 1.4.</p>
  <h3>The six disciplines</h3><p>This course covers six major fields. Most real products need several of them working together: a smartphone needs electrical engineers for the circuits, mechanical engineers for the case and buttons, and chemical engineers for the battery.</p>
  ${discHTML}
  <div class="example"><span class="eyebrow">Watch out · Chemical vs. nuclear</span><p>Both chemical and nuclear engineering deal with substances changing, so they are easy to mix up. Here is the difference. In a <b>chemical reaction</b> only the outer electrons are involved: atoms trade partners and bond in new ways, but every atom is still the same element. Burning gasoline or turning oil into plastic are chemical. In a <b>nuclear reaction</b> the nucleus itself changes, so one element can become a different element, and huge amounts of energy and radiation come out. Uranium splitting into lighter elements in a power plant is nuclear.</p><p><b>Quick test:</b> mixing, bonding, burning or making products from raw materials → <b>Chemical</b>. The nucleus, radiation, splitting atoms or radioactive decay → <b>Nuclear</b>.</p></div>
  ${SORTG('s11','Which type of engineering?',FIELDS,[

  ${FLASH('f11','Key terms · flashcards',v1)}

  <p class="cap">Then answer the knowledge check below.</p>`;

 const h2=H(2,'Engineering measurements and unit conversions')+
  `${EQ('Why are accurate measurements important in engineering?','you can do basic engineering unit conversions and explain why unit consistency is critical.')}
  <p class="bigidea">A number without a unit means nothing. “The beam is 6 long” could be 6 inches or 6 meters, and that difference could make a building collapse. Engineers measure carefully, always write the unit, and convert units correctly.</p>
  <h3>Metric, imperial and SI</h3><div class="vocab"><div><b>Metric system</b>Based on powers of ten, so converting just moves the decimal point. Used by almost every country and by scientists everywhere.</div><div><b>Imperial (US customary) system</b>Inches, feet, yards, miles, pounds and gallons. Still used every day in the United States.</div><div><b>SI units</b>The official metric units: meter (m) for length, kilogram (kg) for mass, second (s) for time. Engineers use SI so everyone means the same thing.</div></div>
  <h3>Accuracy vs. precision</h3><div class="vocab"><div><b>Accurate</b>Close to the true value. A scale reads 50.1 g for a 50 g weight.</div><div><b>Precise</b>Repeated readings agree. A scale reads 47.2, 47.2, 47.3 g every time, even though the true value is 50 g. Precise, but not accurate.</div></div><p>Good measurements are both accurate and precise.</p>
  ${tbl('Length units',[['mm, cm, m, km','10 mm = 1 cm · 100 cm = 1 m · 1000 m = 1 km'],['in, ft, yd, mi','12 in = 1 ft · 3 ft = 1 yd · 5280 ft = 1 mi'],['Metric ↔ imperial','1 in = 2.54 cm · 1 ft ≈ 0.305 m · 1 mi ≈ 1.609 km']])}
  ${tbl('Mass units',[['g, kg','1000 g = 1 kg'],['lb','1 kg ≈ 2.205 lb · 1 lb ≈ 0.454 kg']])}
  ${tbl('Volume units',[['mL, L','1000 mL = 1 L'],['gal','1 gal ≈ 3.785 L']])}
  ${tbl('Speed units',[['m/s and km/h','1 m/s = 3.6 km/h'],['mph and km/h','1 mph ≈ 1.609 km/h'],['knots','1 knot ≈ 1.151 mph ≈ 1.852 km/h. Ships and aircraft use knots.']])}
  <h3>How to convert any unit</h3><p>Multiply by a <b>conversion factor</b>: a fraction equal to 1, with the unit you want on top and the unit you have on the bottom. The old unit cancels out. Quick check: going to a <b>smaller</b> unit, the number gets <b>bigger</b>.</p>
  ${WEX('Worked example · cm to m','Convert 250 cm to meters.',['250 cm × (1 m ÷ 100 cm)','250 ÷ 100 = 2.5 m'])}
  ${WEX('Worked example · m to km','Convert 4,500 m to kilometers.',['4,500 m × (1 km ÷ 1000 m)','4,500 ÷ 1000 = 4.5 km'])}
  ${WEX('Worked example · in to ft','Convert 54 inches to feet.',['54 in × (1 ft ÷ 12 in)','54 ÷ 12 = 4.5 ft'])}
  ${WEX('Worked example · mi to km','Convert 10 miles to kilometers.',['10 mi × (1.609 km ÷ 1 mi)','10 × 1.609 = 16.09 km'])}
  ${WEX('Worked example · mph to knots','A boat travels at 23 mph. What is that in knots?',['23 mph × (1 knot ÷ 1.151 mph)','23 ÷ 1.151 ≈ 20 knots'])}
  <div class="example"><span class="eyebrow">Real world · Mars Climate Orbiter (1999)</span><p>NASA’s Mars Climate Orbiter was lost because one engineering team gave thruster data in imperial units (pound-force seconds) while the navigation team expected metric units (newton seconds). Nobody caught the mismatch. The spacecraft flew far too close to Mars and was destroyed, a loss of about $125 million. The math was fine; the <b>units</b> were not consistent.</p></div>
  <h3>Vocabulary</h3><div class="vocab">${v2.map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>
  <p class="cap">Use the unit converter below to check your answers, then do the practice problems.</p>`;

  `${EQ('How does each engineering field use math?','you understand that every engineering field relies on math, but each uses it in different ways.')}
  <p class="bigidea">Every engineer uses math, but each field uses its own favorite equations. Today you will meet one simple equation from each discipline. You will use all of them again later in the course.</p>
  ${grid('Math skills you will use',[['Basic algebra','Solving for an unknown, like finding I in V = I × R.'],['Ratios','Comparing two amounts, like 40 teeth to 10 teeth = 4:1.'],['Percentages','Parts per hundred: part ÷ whole × 100.'],['Graphs','Pictures of data. The slope of a line is a rate.'],['Formula substitution','Replace each letter in a formula with its number and unit, then calculate.']])}
  <div class="example"><span class="eyebrow">Formula substitution in 3 steps</span><div class="steps"><span>1. Write the formula.</span><span>2. Plug in the numbers with their units.</span><span>3. Calculate, and write the unit on the answer.</span></div></div>
  <div class="example"><span class="eyebrow">Algebra 1 skill · Solving for a different variable</span><p>Every formula can be rearranged to solve for any letter in it. Do the same thing to both sides until the letter you want is alone. You will do this in every chapter.</p><div class="steps"><span>V = I × R → divide both sides by I → R = V ÷ I</span><span>d = v × t → divide both sides by v → t = d ÷ v</span><span>P = F ÷ A → multiply both sides by A → F = P × A</span><span>c² = a² + b² → subtract a², take the square root → b = √(c² − a²)</span></div></div>

  <h3>Graphs</h3><p>Engineers in every field graph their data. A straight line means the quantity changes at a steady rate.</p>${graph}
  <p class="cap">Now try one or more problems from each field below.</p>`;

      <div class="fbline"><b>Feedback:</b> ${esc((S.fb&&S.fb[k])||'')}</div>

function doneHTML(u,i,d){
  const dq=u.qs.filter(q=>q.d===d); const left=dq.filter(q=>!(S.q[q.id]&&S.q[q.id].done)).length;
  if(failed(`w${u.wk}d${d}`)) return `<section class="example" id="lockedcard"><span class="eyebrow">Canvas screenshot · ${u.dn(d)}</span><p><strong>No completion card yet.</strong> This attempt had a wrong answer, so the day has to be done again from the start with 100% correct.</p><button class="btn" data-restart="w${u.wk}d${d}">↺ Start over with shuffled questions</button></section>`;
  if(left) return `<section class="example" id="lockedcard"><span class="eyebrow">Canvas screenshot · ${u.dn(d)}</span><p><strong>Your completion card for ${u.dn(d)} appears here.</strong> Finish the ${left} remaining problem${left===1?'':'s'} above, then answer the quick feedback question. Screenshot the card and add it to your Canvas document.</p></section>`;
  const k=`w${u.wk}d${d}`; S.fb=S.fb||{};
  if(S.fb[k]===undefined) return `<section class="example" id="fbbox"><span class="eyebrow">One last step</span><p><strong>Before your completion card appears:</strong> was anything confusing, broken, or wrong in ${u.dn(d)}, or is there anything that could be improved? Name the problem number if you can.</p><label class="lbl" for="fbText">Your feedback (leave it blank if everything was fine)</label><textarea id="fbText" rows="3" placeholder="Example: Problem 4 has the wrong unit."></textarea><div class="nextrow" style="justify-content:flex-start;margin-top:10px"><button class="btn" data-fb="${k}">Show my completion card</button></div></section>`;
  return cardHTML(u,i,d);
}

}

function rerenderQ(id){

  const vc=document.getElementById('vCount'); if(vc){const dq=u.qs.filter(x=>x.d===q.d); vc.textContent=`${dq.filter(x=>S.q[x.id]&&S.q[x.id].done).length}/${dq.length}`;}
  refreshCard();

function win(s){s.done=true;s.how='correct';s.msg='';s.at=Date.now();s.cheer=CHEERS[Math.floor(Math.random()*CHEERS.length)];}

document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('nameIn')){S.name=e.target.value;save();document.querySelectorAll('.ccode').forEach(el=>{const u=UNITS.find(x=>x.id===el.dataset.u);if(u)el.textContent=codeText(u,+el.dataset.d);});}
});
document.addEventListener('click',e=>{

  const fb=e.target.closest('[data-fb]');
  if(fb){const k=fb.dataset.fb,m=k.match(/^w(\d+)d(\d)$/),u=UNITS.find(x=>x.wk===+m[1]);S.fb=S.fb||{};S.fb[k]=(document.getElementById('fbText').value||'').trim()||'No issues reported.';save();
    document.getElementById('doneArea').innerHTML=cardHTML(u,UNITS.indexOf(u),+m[2]);const nw=document.getElementById('navWrap');if(nw)nw.innerHTML=navRow(UNITS.indexOf(u),+m[2]);renderDayTabs(u);document.querySelector('#doneArea .celebrate').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  if(e.target.closest('[data-jump]')){document.getElementById('subcard')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const qel=b.closest('.q'); if(!qel) return; const id=qel.dataset.id; const q=ALL.find(x=>x.id===id); const s=st(id);
  const act=b.dataset.act; if(failed(dk(id))||s.done||s.wrong) return; tmark(q);
  if(act==='hint'){s.hint=!s.hint;}
  else if(act==='check'){ check(q,s,document.getElementById('in-'+id).value); }
  else if(act==='pick'){ const i=+b.dataset.i; s.pick=[i];
    if(i===q.a) win(s); else {s.wrong=true;s.msg='';s.at=Date.now();failDay(dk(id));} }
  tend(q); save(); if(s.wrong) afterFail(q); else rerenderQ(id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('in-')){
    const id=e.target.id.slice(3); const q=ALL.find(x=>x.id===id); const s=st(id);
    if(failed(dk(id))||s.done||s.wrong) return;
    tmark(q); check(q,s,e.target.value); tend(q); save(); if(s.wrong) afterFail(q); else rerenderQ(id);
  }
});
function check(q,s,raw){
  const v=parseFloat(String(raw).replace(/,/g,'').replace(/[^\d.\-]/g,' ').trim().split(/\s+/)[0]);
  if(!isFinite(v)){s.msg='Type a number. The unit is already there for you.';return;}
  const qa=qView(q).a, tol=Math.max(Math.abs(qa)*0.01,q.tol||0);
  if(Math.abs(v-qa)<=tol){win(s);s.val=raw;}
  else{s.wrong=true;s.val=raw;s.msg='';s.at=Date.now();failDay(dk(q.id));}
}
function failHTML(u,d){const k=`w${u.wk}d${d}`,dq=dayView(u,d),miss=dq.find(v=>S.q[v.id]&&S.q[v.id].wrong),right=dq.filter(v=>S.q[v.id]&&S.q[v.id].done).length;
  return `<section class="failbox" id="failbox" role="alert"><span class="eyebrow">Attempt ${att(k)+1} · ${u.dn(d)}</span><h3>Question ${miss?miss.pos:''} was not correct. You need 100% to finish this day.</h3><p>You got ${right} right before the miss. Read the method under the missed question, check the learning material if you need to, then start over. The questions will come back in a new order, the answer choices will be mixed up, and most of the numbers will change.</p><button class="btn" data-restart="${k}">↺ Start over with shuffled questions</button></section>`;}
function afterFail(q){const u=unitOf(q);render();const f=document.getElementById('failbox');if(f)f.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}

document.addEventListener('click',e=>{const vw=e.target.closest('[data-view]');if(vw){S.view=vw.dataset.view;save();render();const vn=document.querySelector('.viewnav');if(vn)vn.scrollIntoView({block:'start'});return;}const g=e.target.closest('[data-go]');if(g){const [ti,td]=g.dataset.go.split(',').map(Number);S.tab=UNITS[ti].id;S.day=td;save();render();scrollTo(0,0);return;}const n=e.target.closest('[data-nav]');if(n){S.day=+n.dataset.nav;save();render();scrollTo(0,0);}});

(function(){const B=document.getElementById('calcBtn'),P=document.getElementById('calc'),I=document.getElementById('calcIn'),H=document.getElementById('calcHist'),HD=document.getElementById('calcHd'),KS=document.getElementById('calcKeys'),K='be-calc';
 let ans=0,fresh=false;
 const keys=[['C','C'],['⌫','B'],['(','('],[')',')'],['x²','^2'],['√','√('],['π','π'],['÷','÷'],['7'],['8'],['9'],['×','×'],['4'],['5'],['6'],['−','−'],['1'],['2'],['3'],['+','+'],['0'],['.'],['Ans','Ans'],['=','=']];
 KS.innerHTML=keys.map(k=>{const v=k[1]||k[0],c=v==='='?'eq':'+−×÷'.includes(v)?'op':'';return `<button type="button" class="${c}" data-ck="${v}">${k[0]}</button>`;}).join('');
 const ev=()=>{let e=I.value.trim();if(!e)return;if(!/^[0-9+\-×÷−*\/().^π√\sAns]*$/.test(e)){I.value='Error';fresh=true;return;}
  let j=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/π/g,'(Math.PI)').replace(/√/g,'Math.sqrt').replace(/Ans/g,'('+ans+')');
  if(!/^[0-9+\-*\/().\sMathPIsqrt]*$/.test(j)){I.value='Error';fresh=true;return;}
  let r;try{r=Function('"use strict";return ('+j+')')();}catch(x){r=NaN;}
  H.textContent=e+' =';if(typeof r!=='number'||!isFinite(r)){I.value='Error';fresh=true;return;}
  ans=+r.toPrecision(12);I.value=String(ans);fresh=true;};
 const press=v=>{if(v==='C'){I.value='';H.textContent='';fresh=false;return;}
  if(v==='B'){I.value=fresh?'':I.value.replace(/(Ans|.)$/,'');fresh=false;return;}
  if(v==='=')return ev();
  if(fresh&&/^[0-9.π√(]|^Ans$/.test(v)){I.value='';H.textContent='';}
  fresh=false;I.value+=v;};
 KS.addEventListener('click',e=>{const b=e.target.closest('[data-ck]');if(b)press(b.dataset.ck);});
 I.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ev();}});
 I.addEventListener('input',()=>{fresh=false;});
 const place=(x,y)=>{const w=P.offsetWidth,h=P.offsetHeight;P.style.right='auto';P.style.bottom='auto';P.style.left=Math.min(Math.max(0,x),innerWidth-w)+'px';P.style.top=Math.min(Math.max(0,y),innerHeight-h)+'px';};

 const setOpen=o=>{P.hidden=!o;B.setAttribute('aria-expanded',o);if(o&&P.style.left)place(parseFloat(P.style.left),parseFloat(P.style.top));save2();};

(function(){const B=document.getElementById('fmBtn'),P=document.getElementById('fm'),HD=document.getElementById('fmHd'),K='be-fm2';
 const strip=h=>h.replace(/<[^>]+>/g,'');
 const EMO={Intro:'📘',Civil:'🏗️',Mechanical:'⚙️',Electrical:'⚡',Aerospace:'✈️',Chemical:'🧪',Nuclear:'☢️',Capstone:'🎓'},em=n=>EMO[n]?EMO[n]+' ':'';

 const sv2=()=>{try{localStorage.setItem(K,JSON.stringify({o:!P.hidden,l:P.style.left,t:P.style.top}));}catch(e){}};
 const setOpen=o=>{P.hidden=!o;B.setAttribute('aria-expanded',o);if(o){draw();if(P.style.left)place(parseFloat(P.style.left),parseFloat(P.style.top));}sv2();};
 B.onclick=()=>setOpen(P.hidden);document.getElementById('fmX').onclick=()=>setOpen(false);
 let dr=null;HD.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=P.getBoundingClientRect();dr={x:e.clientX-r.left,y:e.clientY-r.top};HD.setPointerCapture(e.pointerId);});
 HD.addEventListener('pointermove',e=>{if(dr)place(e.clientX-dr.x,e.clientY-dr.y);});
 HD.addEventListener('pointerup',()=>{if(dr){dr=null;sv2();}});
 addEventListener('resize',()=>{if(!P.hidden&&P.style.left)place(parseFloat(P.style.left),parseFloat(P.style.top));});
 try{const t=JSON.parse(localStorage.getItem(K)||'null');if(t){if(t.l){P.style.left=t.l;P.style.top=t.t;P.style.right='auto';P.style.bottom='auto';}if(t.o)setOpen(true);}}catch(e){}
})();
